<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CC® Admin CMS</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;600;800;900&display=swap"
        rel="stylesheet">
    <!-- Base styles for some shared UI variables, plus admin specific CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/admin.css">

    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- SortableJS for Drag and Drop -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
</head>

<body class="admin-body">

    <!-- LOGIN OVERLAY -->
    <div id="admin-login" class="admin-login-overlay">
        <div class="login-card">
            <h2>Admin Login</h2>
            <p>Please enter your Supabase credentials.</p>
            <form id="login-form">
                <input type="email" id="login-email" placeholder="Email Address" required>
                <input type="password" id="login-password" placeholder="Password" required>
                <button type="submit" class="admin-btn primary">Login</button>
            </form>
            <div id="login-error" class="error-text"></div>
        </div>
    </div>

    <!-- MAIN DASHBOARD (Hidden until authenticated) -->
    <div id="admin-dashboard" class="admin-layout" style="display: none;">

        <!-- SIDEBAR -->
        <aside class="admin-sidebar">
            <div class="sidebar-brand">
                <h1>CC® CMS</h1>
            </div>
            <nav class="sidebar-nav">
                <a href="#" class="nav-item active">Portfolio Videos</a>
                <a href="#" class="nav-item">Settings (WIP)</a>
            </nav>
            <div class="sidebar-footer">
                <button id="logout-btn" class="admin-btn text-btn">Logout</button>
            </div>
        </aside>

        <!-- MAIN CONTENT AREA -->
        <main class="admin-main">

            <!-- LIST VIEW -->
            <div id="view-list" class="view-panel active">
                <header class="main-header">
                    <h2>Manage Portfolio</h2>
                    <button id="btn-add-new" class="admin-btn primary">+ Add Project</button>
                </header>

                <div class="controls-bar">
                    <input type="text" id="search-input" placeholder="Search by title, category, tags..."
                        class="search-input">
                    <select id="filter-select" class="filter-select">
                        <option value="All">All Categories</option>
                        <option value="Commercial">Commercial</option>
                        <option value="Wedding">Wedding</option>
                        <option value="Music Video">Music Video</option>
                        <option value="Real Estate">Real Estate</option>
                        <option value="Documentary">Documentary</option>
                        <option value="Featured">Featured Only</option>
                        <option value="Hidden">Hidden Only</option>
                    </select>
                </div>

                <div class="projects-list-header">
                    <span class="col-drag"></span>
                    <span class="col-thumb">Thumbnail</span>
                    <span class="col-title">Details</span>
                    <span class="col-status">Status</span>
                    <span class="col-actions">Actions</span>
                </div>

                <!-- DRAG AND DROP LIST -->
                <div id="projects-list" class="projects-list">
                    <!-- Loaded dynamically -->
                </div>
            </div>

            <!-- EDITOR VIEW (Hidden initially) -->
            <div id="view-editor" class="view-panel" style="display: none;">
                <header class="main-header">
                    <h2 id="editor-title">Edit Project</h2>
                    <div class="header-actions">
                        <button id="btn-cancel" class="admin-btn secondary">Cancel</button>
                        <button id="btn-save" class="admin-btn primary">Save Changes</button>
                    </div>
                </header>

                <div class="editor-layout">
                    <!-- FORM -->
                    <div class="editor-form-col">
                        <form id="project-form">
                            <input type="hidden" id="edit-id">

                            <div class="form-group">
                                <label>Title</label>
                                <input type="text" id="edit-title" required>
                            </div>

                            <div class="form-group row">
                                <div class="col">
                                    <label>Category</label>
                                    <input type="text" id="edit-category" placeholder="e.g. Commercial" required>
                                </div>
                                <div class="col">
                                    <label>Year</label>
                                    <input type="text" id="edit-year" placeholder="e.g. 2026">
                                </div>
                            </div>

                            <div class="form-group">
                                <label>YouTube URL / ID</label>
                                <input type="text" id="edit-youtube" placeholder="https://youtube.com/watch?v=..."
                                    required>
                                <small>Paste full link or just the 11-character video ID.</small>
                            </div>

                            <div class="form-group">
                                <label>Custom Thumbnail URL (Optional)</label>
                                <input type="text" id="edit-thumbnail" placeholder="assets/images/portfolio-custom.jpg">
                                <small>Leave empty to auto-fetch from YouTube.</small>
                            </div>

                            <div class="form-group">
                                <label>Description</label>
                                <textarea id="edit-description" rows="3"></textarea>
                            </div>

                            <div class="form-group">
                                <label>Tags (Comma separated)</label>
                                <input type="text" id="edit-tags" placeholder="Cinematic, Drone, Fast Paced">
                            </div>

                            <div class="form-group">
                                <label>Client (Optional)</label>
                                <input type="text" id="edit-client">
                            </div>

                            <div class="form-group switches">
                                <label class="switch-label">
                                    <input type="checkbox" id="edit-show-main">
                                    <span>Show on Main Site</span>
                                </label>
                                <label class="switch-label">
                                    <input type="checkbox" id="edit-show-work" checked>
                                    <span>Show on Work Page</span>
                                </label>
                                <label class="switch-label">
                                    <input type="checkbox" id="edit-hidden">
                                    <span>Hide Project (Draft mode)</span>
                                </label>
                            </div>
                        </form>
                    </div>

                    <!-- LIVE PREVIEW -->
                    <div class="editor-preview-col">
                        <label class="preview-label">Live Card Preview</label>
                        <div class="preview-container">
                            <a href="#" class="project-card" style="width: 100%; pointer-events: none;">
                                <div class="project-media">
                                    <span class="project-badge" id="preview-badge">Category</span>
                                    <img src="assets/images/placeholder.jpg" alt="Preview" class="project-img"
                                        id="preview-img">
                                    <div class="project-play-overlay"
                                        style="opacity: 1; transform: translate(-50%, -50%) scale(1);">
                                        <svg viewBox="0 0 24 24" fill="currentColor">
                                            <path d="M8 5v14l11-7z" />
                                        </svg>
                                    </div>
                                </div>
                                <div class="project-info">
                                    <span class="project-title" id="preview-title">Project Title</span>
                                    <span class="project-year" id="preview-year">2026</span>
                                </div>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="js/supabase-config.js"></script>
    <script src="js/admin.js"></script>
</body>

</html>
